<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Welcome to RideChain</title>
</head>
<body class="bg-gray-100 text-gray-800 font-sans leading-relaxed">
    <div class="container mx-auto p-6 bg-white rounded shadow">
        <h1 class="text-3xl font-bold text-blue-600 mb-4">Welcome to RideChain!</h1>
        <p class="mb-4">Dear {{ subscriber.name }},</p>
        <p class="mb-4">Thanks for joining our community. We're excited to have you on board.</p>
        <p class="mb-4">Explore our platform and discover new ways to share rides and connect with fellow travelers.</p>
        <p class="mb-4">Best,</p>
        <p class="mb-4">The RideChain Team</p>
        <div class="text-xs text-gray-500 mt-6">
            <p class="mb-4">This is an automated message. Please do not reply.</p>
        </div>
    </div>
</body>
</html>
